<head>
<meta charset="utf-8">

<title>Datos de transferencia · Miyamoto</title>
<style>
  :root { --bg:#ffffff; --card:#fff; --ink:#151515; --mute:#6b6b6b; --line:#e4e2dc; --acc:#151515; --ok:#1f7a4d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding:28px 18px 40px; }
  .wrap { max-width:440px; margin:0 auto; }
  .logo { display:block; width:78%; max-width:320px; margin:4px auto 26px; }
  .eyebrow { font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
  h1 { font-size:26px; line-height:1.15; margin:6px 0 22px; font-weight:700; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .txt { flex:1; min-width:0; }
  .lbl { font-size:12px; color:var(--mute); margin-bottom:2px; }
  .val { font-size:16px; font-weight:600; word-break:break-all; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fafafa; color:var(--ink); border-radius:10px; padding:8px 12px; font-size:14px; font-weight:600; white-space:nowrap; transition:all .15s; }
  button:active { transform:scale(.97); }
  button.done { background:var(--ok); border-color:var(--ok); color:#fff; }
  .all { width:100%; margin-top:16px; padding:16px; border-radius:14px; background:var(--acc); color:#fff; border:none; font-size:16px; }
  .all.done { background:var(--ok); }
  .note { font-size:13px; color:var(--mute); text-align:center; margin-top:14px; line-height:1.4; }
</style>
</head>

  <h1>Datos de transferencia</h1>
  <button class="all" id="all" style="margin:0 0 16px">Copiar todos los datos</button>
  <div class="card" id="list"></div>
  <p class="note">Copia todo y pégalo en la app de tu banco. Si tu banco no lo reconoce, copia dato por dato.</p>
</div>
<script>
const datos = [
  ["Nombre", "Javier Alexis Navarro Jara", "Javier Alexis Navarro Jara"],
  ["RUT", "20.599.078-K", "20599078K"],
  ["Banco", "Mercado Pago", "Mercado Pago"],
  ["Tipo de cuenta", "Cuenta Vista", "Cuenta Vista"],
  ["Número de cuenta", "1057971811", "1057971811"],
  ["Correo", "javier.navarrojara@gmail.com", "javier.navarrojara@gmail.com"]
];
const list = document.getElementById("list");

function fallbackCopy(t){
  const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly","");
  ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta);
  ta.select(); ta.setSelectionRange(0,t.length);
  let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta); return ok;
}
async function copy(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){ return fallbackCopy(t); }
}
function flash(btn, txtOk, txtBase){
  btn.classList.add("done"); btn.textContent=txtOk;
  setTimeout(()=>{ btn.classList.remove("done"); btn.textContent=txtBase; },1600);
}

datos.forEach(([lbl, show, raw])=>{
  const r=document.createElement("div"); r.className="row";
  r.innerHTML='<div class="txt"><div class="lbl"></div><div class="val"></div></div>';
  r.querySelector(".lbl").textContent=lbl;
  r.querySelector(".val").textContent=show;
  const b=document.createElement("button"); b.textContent="Copiar";
  b.addEventListener("click", async()=>{ if(await copy(raw)) flash(b,"Copiado","Copiar"); else b.textContent="Mantén presionado el dato"; });
  r.appendChild(b); list.appendChild(r);
});

document.getElementById("all").addEventListener("click", async(e)=>{
  const t=datos.map(([l,s,r])=>l+": "+(l==="RUT"?s:r)).join("\n");
  const b=e.currentTarget;
  if(await copy(t)) flash(b,"Datos copiados","Copiar todos los datos");
});
</script>
